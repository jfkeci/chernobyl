<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chernobyl — Reactor 4, 26 April 1986</title>
<style>
  html,body{margin:0;height:100%;background:#05070c;color:#e8e6df;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}

<body>
<div id="hud">

    <div><div class="lab">LOCAL TIME</div><div class="val" id="clk">01:23:36</div></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const R = (a=1,b)=> b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const RS = (a=1)=> (Math.random()*2-1)*a;
const $ = id=>document.getElementById(id);

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070c);
scene.fog = new THREE.FogExp2(0x05070c, 0.0014);
const world = new THREE.Group(); scene.add(world);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.5, 3000);
camera.position.set(150,70,170);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,45,0);
controls.enableDamping = true;
controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
controls.maxPolarAngle = Math.PI/2-0.03; controls.minDistance = 60; controls.maxDistance = 600;

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x5a6c9c, 0x0a0a0c, 0.9));
const moon = new THREE.DirectionalLight(0x8fa6d8, 0.9); moon.position.set(-200,300,150); scene.add(moon);
const fireLight = new THREE.PointLight(0xff7a2a, 0, 900, 1); fireLight.position.set(0,58,0); world.add(fireLight);
const coreLight = new THREE.PointLight(0xffa040, 0, 300, 1); coreLight.position.set(0,34,0); world.add(coreLight);

// ---------- stars ----------
{
  const n=1800, p=new Float32Array(n*3);
  for(let i=0;i<n;i++){ const th=R(Math.PI*2), ph=Math.acos(R(0.02,1)), r=1400;
    p[i*3]=r*Math.sin(ph)*Math.cos(th); p[i*3+1]=r*Math.cos(ph); p[i*3+2]=r*Math.sin(ph)*Math.sin(th); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xcfd8ff,size:2.2,sizeAttenuation:false,fog:false,transparent:true,opacity:.8})));
}

// ---------- textures ----------
function windowTex(cols,rows,lit=.35){
  const c=document.createElement('canvas'); c.width=cols*16; c.height=rows*16; const x=c.getContext('2d');
  x.fillStyle='#3a3c40'; x.fillRect(0,0,c.width,c.height);
  for(let i=0;i<4000;i++){ x.fillStyle=`rgba(${R()<.5?0:255},${R()<.5?0:255},${R()<.5?0:255},.03)`; x.fillRect(R(c.width),R(c.height),R(8),R(30)); }
  for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){
    x.fillStyle = R()<lit ? `hsl(${R(38,52)},90%,${R(55,75)}%)` : '#16181c';
    x.fillRect(q*16+4,r*16+4,8,7);
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function bmat(cols,rows,lit){ const t=windowTex(cols,rows,lit);
  return new THREE.MeshStandardMaterial({map:t,emissiveMap:t,emissive:0xffffff,emissiveIntensity:.55,roughness:.9}); }
const concrete = new THREE.MeshStandardMaterial({color:0x55585e,roughness:.95});
const dark = new THREE.MeshStandardMaterial({color:0x2b2d31,roughness:1});

// ---------- site ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000,4000), new THREE.MeshStandardMaterial({color:0x14171a,roughness:1}));
ground.rotation.x=-Math.PI/2; world.add(ground);
function box(w,h,d,x,y,z,m){ const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); b.position.set(x,y+h/2,z); world.add(b); return b; }

const H=50, W=36;                       // reactor hall of unit 4 (open box, roof = debris slabs)
const hallMat = bmat(10,12,.12);
box(W,H,2, 0,0, W/2-1, hallMat); box(W,H,2, 0,0,-W/2+1, hallMat);
box(2,H,W-4, W/2-1,0,0, hallMat); box(2,H,W-4,-W/2+1,0,0, hallMat);
box(W-4,18,W-4,0,0,0,dark);              // reactor vault floor
box(70,30,60, 0,0,0, bmat(18,7,.3)).position.x=0; // lower block around hall
// unit 3 + shared auxiliary block with vent stack
box(40,34,60,-58,0,0,bmat(10,8,.4));
box(W,H,W,-98,0,0,bmat(10,12,.2));
box(70,30,60,-98,0,0,bmat(18,7,.4));
// turbine hall (long) in front
box(260,22,44,-50,0,58,bmat(60,5,.45));
box(260,3,46,-50,22,58,dark);
// deaerator stack
box(240,36,10,-50,0,32,bmat(50,8,.3));
// small outbuildings
for(let i=0;i<8;i++) box(R(14,34),R(6,14),R(14,30), RS(260), 0, -90-R(120), bmat(6,3,.5));
for(let i=0;i<5;i++) box(R(14,30),R(6,12),R(14,30), 120+R(140), 0, RS(160), bmat(6,3,.5));

// vent stack (red/white bands + platforms)
const stack = new THREE.Group(); stack.position.set(-58,34,-6); world.add(stack);
for(let i=0;i<10;i++){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.2,8,24,1,true),
    new THREE.MeshStandardMaterial({color:i%2?0xd9d6cf:0xa8281e,roughness:.8,side:THREE.DoubleSide}));
  m.position.y=4+i*8; stack.add(m);
  if(i%2===0){ const r=new THREE.Mesh(new THREE.TorusGeometry(6,.35,6,24),concrete); r.rotation.x=Math.PI/2; r.position.y=i*8+8; stack.add(r); }
}
for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; const l=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,80,5),concrete);
  l.position.set(Math.cos(a)*6,40,Math.sin(a)*6); stack.add(l); }
const beacon = new THREE.Mesh(new THREE.SphereGeometry(.9,8,8), new THREE.MeshBasicMaterial({color:0xff2020}));
beacon.position.y=81; stack.add(beacon);

// reactor core + upper biological shield ("Elena")
const coreMat = new THREE.MeshBasicMaterial({color:0x331100});
const core = new THREE.Mesh(new THREE.CylinderGeometry(9,9,16,32), coreMat); core.position.y=27; world.add(core);
const lid = new THREE.Mesh(new THREE.CylinderGeometry(10.5,10.5,3,32), new THREE.MeshStandardMaterial({color:0x6a6d73,roughness:.7,metalness:.3,emissive:0xff4400,emissiveIntensity:0}));
world.add(lid);
const lidS = {vel:new THREE.Vector3(), rv:new THREE.Vector3(), fly:false, done:false};

// ---------- debris (instanced rigid chunks) ----------
const dummy = new THREE.Object3D(), G=-32;
class Debris{
  constructor(n,mat){ this.n=n; this.mesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),mat,n);
    this.mesh.frustumCulled=false; world.add(this.mesh); this.next=0;
    this.it=[...Array(n)].map(()=>({p:new THREE.Vector3(),v:new THREE.Vector3(),r:new THREE.Euler(),rv:new THREE.Vector3(),s:new THREE.Vector3(),sleep:true,age:0})); }
  hideAll(){ for(const d of this.it){ d.s.set(0,0,0); d.sleep=true; d.age=0; } this.next=0; this.sync(true); }
  spawn(p,v,s){ const d=this.it[this.next++ % this.n]; d.p.copy(p); d.v.copy(v); d.s.copy(s); d.r.set(R(6),R(6),R(6)); d.rv.set(RS(6),RS(6),RS(6)); d.sleep=false; d.age=0; return d; }
  update(dt){ for(const d of this.it){ d.age+=dt; if(d.sleep) continue;
      d.v.y+=G*dt; d.p.addScaledVector(d.v,dt); d.r.x+=d.rv.x*dt; d.r.y+=d.rv.y*dt; d.r.z+=d.rv.z*dt;
      const fl=Math.max(d.s.x,d.s.y,d.s.z)*.35;
      if(d.p.y<fl){ d.p.y=fl; d.v.y*=-.28; d.v.x*=.55; d.v.z*=.55; d.rv.multiplyScalar(.45);
        if(d.v.lengthSq()<6){ d.sleep=true; } } }
    this.sync(); }
  sync(){ this.it.forEach((d,i)=>{ dummy.position.copy(d.p); dummy.rotation.copy(d.r); dummy.scale.copy(d.s); dummy.updateMatrix(); this.mesh.setMatrixAt(i,dummy.matrix); });
    this.mesh.instanceMatrix.needsUpdate=true; }
}
const NS=6, slabN=NS*NS;
const rubble = new Debris(slabN+520, new THREE.MeshStandardMaterial({color:0x6b6e74,roughness:.95}));
const graphite = new Debris(340, new THREE.MeshBasicMaterial({color:0xffffff}));
const gcol = new THREE.Color();

function resetRoof(){
  rubble.hideAll(); graphite.hideAll();
  for(let i=0;i<NS;i++)for(let j=0;j<NS;j++){ const d=rubble.it[rubble.next++];
    d.p.set((i-NS/2+.5)*W/NS, H+.75, (j-NS/2+.5)*W/NS); d.s.set(W/NS-.05,1.5,W/NS-.05); d.r.set(0,0,0); d.v.set(0,0,0); d.sleep=true; }
  rubble.sync();
}
function blowRoof(inner,power){
  for(let k=0;k<slabN;k++){ const d=rubble.it[k]; if(!d.sleep||d.p.y<H) continue;
    const dist=Math.hypot(d.p.x,d.p.z); if(inner && dist>11) continue;
    d.sleep=false; d.v.set(d.p.x*R(.6,1.6)+RS(4), R(22,48)*power, d.p.z*R(.6,1.6)+RS(4)); d.rv.set(RS(5),RS(5),RS(5)); }
}
const tmpP=new THREE.Vector3(), tmpV=new THREE.Vector3(), tmpS=new THREE.Vector3();
function burst(sys,n,power,smin,smax){
  for(let i=0;i<n;i++){ const a=R(Math.PI*2), up=R(.25,1), sp=R(12,62)*power, h=Math.sqrt(1-up*up*.8);
    tmpP.set(RS(8),R(36,50),RS(8)); tmpV.set(Math.cos(a)*h*sp*.75, up*sp, Math.sin(a)*h*sp*.75);
    const s=R(smin,smax); tmpS.set(s*R(.5,1.6),s*R(.4,1),s*R(.5,1.6)); sys.spawn(tmpP,tmpV,tmpS); }
}

// ---------- particles ----------
const pUni = {uScale:{value:innerHeight*.9}};
class PSys{
  constructor(n,blend,upd){ this.n=n; this.upd=upd; this.i=0;
    this.pos=new Float32Array(n*3); this.col=new Float32Array(n*4); this.size=new Float32Array(n);
    this.vel=new Float32Array(n*3); this.life=new Float32Array(n); this.max=new Float32Array(n).fill(1); this.s0=new Float32Array(n); this.k=new Float32Array(n);
    const g=this.g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(this.pos,3));
    g.setAttribute('aCol',new THREE.BufferAttribute(this.col,4));
    g.setAttribute('aSize',new THREE.BufferAttribute(this.size,1));
    const m=new THREE.ShaderMaterial({uniforms:pUni,transparent:true,depthWrite:false,blending:blend,
      vertexShader:`attribute vec4 aCol; attribute float aSize; varying vec4 vC; uniform float uScale;
        void main(){ vC=aCol; vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=aSize*uScale/-mv.z; gl_Position=projectionMatrix*mv; }`,
      fragmentShader:`varying vec4 vC; void main(){ float d=length(gl_PointCoord-.5); float a=smoothstep(.5,.05,d); gl_FragColor=vec4(vC.rgb,vC.a*a); }`});
    this.pts=new THREE.Points(g,m); this.pts.frustumCulled=false; world.add(this.pts); }
  emit(x,y,z,vx,vy,vz,life,size,kind=0){ const i=this.i=(this.i+1)%this.n;
    this.pos[i*3]=x;this.pos[i*3+1]=y;this.pos[i*3+2]=z; this.vel[i*3]=vx;this.vel[i*3+1]=vy;this.vel[i*3+2]=vz;
    this.life[i]=0; this.max[i]=life; this.s0[i]=size; this.k[i]=kind; }
  clear(){ this.life.fill(1e9); this.size.fill(0); this.col.fill(0); }
  update(dt){ const {pos,vel,life,max,n}=this;
    for(let i=0;i<n;i++){ if(life[i]>=max[i]){ if(this.size[i]){this.size[i]=0;this.col[i*4+3]=0;} continue; }
      life[i]+=dt; this.upd(this,i,life[i]/max[i],dt);
      pos[i*3]+=vel[i*3]*dt; pos[i*3+1]+=vel[i*3+1]*dt; pos[i*3+2]+=vel[i*3+2]*dt;
      if(pos[i*3+1]<.3){pos[i*3+1]=.3; vel[i*3+1]*=-.2;} }
    for(const a of ['position','aCol','aSize']) this.g.attributes[a].needsUpdate=true; }
}
const smoke = new PSys(5000, THREE.NormalBlending, (s,i,k,dt)=>{
  const dr=1-1.1*dt; s.vel[i*3]=s.vel[i*3]*dr+5*dt; s.vel[i*3+2]*=dr; s.vel[i*3+1]=s.vel[i*3+1]*dr+7*dt;
  const base=s.k[i], hot=Math.max(0,1-k*5)*(base<.5?1:0);
  s.col[i*4]=base+hot*1.0; s.col[i*4+1]=base+hot*.35; s.col[i*4+2]=base+hot*.05;
  s.col[i*4+3]=Math.sin(Math.min(1,k)*Math.PI)**.6*(base<.5?.6:.3);
  s.size[i]=s.s0[i]*(1+5*k);
});
const fire = new PSys(6000, THREE.AdditiveBlending, (s,i,k,dt)=>{
  if(s.k[i]===1){ // sparks: ballistic
    s.vel[i*3+1]+=G*.6*dt; s.col[i*4]=1; s.col[i*4+1]=.75-.5*k; s.col[i*4+2]=.3-.3*k; s.col[i*4+3]=1-k*k; s.size[i]=s.s0[i]; return; }
  const dr=1-1.8*dt; s.vel[i*3]*=dr; s.vel[i*3+2]*=dr; s.vel[i*3+1]=s.vel[i*3+1]*dr+14*dt;
  s.col[i*4]=1; s.col[i*4+1]=Math.max(.12,.95-1.2*k); s.col[i*4+2]=Math.max(.02,.6-2.2*k);
  s.col[i*4+3]=(1-k)*.55; s.size[i]=s.s0[i]*(1+2.2*k);
});

// ---------- glow effects ----------
const beam = new THREE.Mesh(new THREE.CylinderGeometry(5,13,520,32,1,true), new THREE.ShaderMaterial({
  uniforms:{o:{value:0},t:{value:0}}, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
  vertexShader:`varying vec2 vU; void main(){ vU=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`varying vec2 vU; uniform float o,t; void main(){ float f=pow(1.-vU.y,1.6); float w=.8+.2*sin(vU.y*40.-t*6.+sin(vU.x*20.));
    gl_FragColor=vec4(.25,.55,1.,1.)*f*o*.4*w; }`}));
beam.position.y=40+260; world.add(beam);
const shock = new THREE.Mesh(new THREE.SphereGeometry(1,32,16), new THREE.MeshBasicMaterial({color:0xffe2b0,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.BackSide}));
shock.position.y=42; world.add(shock);
const ring = new THREE.Mesh(new THREE.RingGeometry(.86,1,64), new THREE.MeshBasicMaterial({color:0xffc890,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
ring.rotation.x=-Math.PI/2; ring.position.y=.6; world.add(ring);

// ---------- timeline ----------
const T_AZ5=4, T_SURGE=8, T_X1=10.5, T_X2=13.2, T_END=42;
const caps=[
 [0,'01:23:04 — THE TEST','A turbine rundown safety test is under way. Reactor 4 sits at just 200 MW, poisoned by xenon and dangerously unstable.'],
 [T_AZ5,'01:23:40 — AZ-5','The emergency shutdown button is pressed. Graphite-tipped control rods slide into the core — and briefly add reactivity.'],
 [T_SURGE,'POWER EXCURSION','Output rockets past 30,000 MW, ten times the design limit. Fuel channels rupture; coolant flashes to steam.'],
 [T_X1,'FIRST EXPLOSION','A steam explosion hurls the 2,000-tonne upper biological shield through the roof of the reactor hall.'],
 [T_X2,'SECOND EXPLOSION','Seconds later a far larger blast tears the building open, scattering burning graphite and nuclear fuel across the site.'],
 [T_X2+7,'THE CORE IS OPEN','Graphite burns at over 1,000 °C. Witnesses describe a pale blue column of ionised air glowing above the ruin.'],
 [T_X2+16,'AFTERMATH','The fire burns for ten days. Fallout crosses Europe; Pripyat\'s 49,000 residents are evacuated 36 hours later.'],
];
let t=0, speed=1, paused=false, x1=false, x2=false, shake=0, flash=0, fireAmt=0, shockT=-1, shockP=1, capI=-1, accF=0, accS=0;

function boom(p){
  for(let i=0;i<900*p;i++){ const a=R(Math.PI*2), up=R(-.1,1), sp=R(8,60)*p, h=Math.sqrt(1-up*up*.9);
    fire.emit(RS(7),R(38,48),RS(7), Math.cos(a)*h*sp, up*sp*1.1, Math.sin(a)*h*sp, R(.8,2.6), R(8,22)*p); }
  for(let i=0;i<700*p;i++){ const a=R(Math.PI*2), up=R(.1,1), sp=R(25,95)*p, h=Math.sqrt(1-up*up);
    fire.emit(RS(5),R(40,48),RS(5), Math.cos(a)*h*sp, up*sp, Math.sin(a)*h*sp, R(1.5,5), R(.8,2.2),1); }
  for(let i=0;i<420*p;i++){ const a=R(Math.PI*2), sp=R(5,34)*p;
    smoke.emit(RS(9),R(38,52),RS(9), Math.cos(a)*sp, R(8,50)*p, Math.sin(a)*sp, R(6,15), R(10,24), R(.05,.14)); }
  shake=Math.max(shake,2.2*p); flash=Math.min(1,.55*p); shockT=0; shockP=p;
}
function reset(){
  t=0; x1=x2=false; shake=flash=fireAmt=0; shockT=-1; capI=-1;
  fire.clear(); smoke.clear(); resetRoof();
  lid.position.set(0,36.5,0); lid.rotation.set(0,0,0); lidS.fly=false; lidS.done=false; lid.material.emissiveIntensity=0;
  beam.material.uniforms.o.value=0; shock.material.opacity=0; ring.material.opacity=0;
}
reset();

$('replay').onclick=reset;
$('pause').onclick=e=>{ paused=!paused; e.target.textContent=paused?'▶ PLAY':'❚❚ PAUSE'; e.target.classList.toggle('on',paused); };
$('slow').onclick=e=>{ speed=speed===1?.25:1; e.target.classList.toggle('on',speed!==1); };
addEventListener('keydown',e=>{ if(e.key===' ') $('pause').click(); if(e.key==='r') reset(); if(e.key==='s') $('slow').click(); });
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); pUni.uScale.value=innerHeight*.9; });

function power(){
  if(t<T_AZ5) return 200+Math.sin(t*3)*4;
  if(t<T_SURGE) return 200+330*((t-T_AZ5)/(T_SURGE-T_AZ5))**2;
  if(t<T_X1) return 530*Math.pow(33000/530,(t-T_SURGE)/(T_X1-T_SURGE));
  return -1;
}

const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const rdt=Math.min(clock.getDelta(),.05), dt=paused?0:rdt*speed, now=performance.now()/1000;
  t+=dt;

  // --- events
  if(!x1 && t>=T_X1){ x1=true; boom(1); blowRoof(true,1); burst(rubble,150,.8,1,3.5);
    lidS.fly=true; lidS.vel.set(4,52,-3); lidS.rv.set(2.6,.4,1.1); }
  if(!x2 && t>=T_X2){ x2=true; boom(2.1); blowRoof(false,1.5); burst(rubble,360,1.25,1,4.5); burst(graphite,340,1.3,.7,1.9); }

  // --- pre-explosion: glow, steam jets, rumble
  const pre = t<T_X1 ? Math.max(0,(t-T_AZ5)/(T_X1-T_AZ5)) : 1;
  if(t>T_SURGE-1.5 && t<T_X1 && dt>0){ shake=Math.max(shake,.12+.5*(pre-.6));
    for(let i=0;i<4;i++){ const a=R(Math.PI*2); smoke.emit(Math.cos(a)*R(14),H+1,Math.sin(a)*R(14), RS(3),R(14,30),RS(3), R(1.5,3), R(3,6), .75); } }

  // --- continuous fire & plume after blasts
  fireAmt += ((x2?1:x1?.45:0)-fireAmt)*Math.min(1,dt*1.5);
  if(fireAmt>.01 && dt>0){
    accF+=dt*260*fireAmt; accS+=dt*95*fireAmt;
    while(accF>1){ accF--; const a=R(Math.PI*2), r=R(11);
      fire.emit(Math.cos(a)*r,R(30,42),Math.sin(a)*r, RS(4),R(8,24),RS(4), R(.7,1.9), R(5,13));
      if(R()<.06) fire.emit(RS(6),40,RS(6), RS(22),R(20,60),RS(22), R(1.5,4), R(.7,1.6),1); }
    while(accS>1){ accS--; const a=R(Math.PI*2), r=R(12);
      smoke.emit(Math.cos(a)*r,R(44,60),Math.sin(a)*r, RS(4),R(16,30),RS(4), R(9,17), R(11,20), R(.05,.13)); }
  }

  // --- lid flight
  if(lidS.fly && !lidS.done){ lidS.vel.y+=G*dt; lid.position.addScaledVector(lidS.vel,dt);
    lid.rotation.x+=lidS.rv.x*dt; lid.rotation.z+=lidS.rv.z*dt; lid.rotation.y+=lidS.rv.y*dt;
    if(lidS.vel.y<0 && lid.position.y<41){ lidS.done=true; lid.position.set(3,40,-2); lid.rotation.set(1.31,.4,.12); shake=Math.max(shake,1.2); } }
  lid.material.emissiveIntensity = x1 ? .5 : pre*pre*.25;

  rubble.update(dt); graphite.update(dt);
  graphite.it.forEach((d,i)=>{ const h=Math.max(.12,1-d.age/26)*(.8+.2*Math.sin(now*9+i)); gcol.setRGB(1.6*h,.5*h*h,.06*h*h); graphite.mesh.setColorAt(i,gcol); });
  if(graphite.mesh.instanceColor) graphite.mesh.instanceColor.needsUpdate=true;
  fire.update(dt); smoke.update(dt);

  // --- lights & glows
  const fl=.85+.15*Math.sin(now*17)*Math.sin(now*7.3);
  flash*=Math.exp(-rdt*3.2);
  coreMat.color.setRGB(.2+pre*pre*3, .07+pre*pre*1.3, .0+pre**4*.5);
  coreLight.intensity = pre*pre*60*fl;
  fireLight.intensity = fireAmt*260*fl + flash*5000;
  $('flash').style.opacity = flash*.8;
  const bo=beam.material.uniforms; bo.o.value += ((x2 && t>T_X2+3 ? 1:0)-bo.o.value)*Math.min(1,dt*.5); bo.t.value=now;
  if(shockT>=0){ shockT+=dt; const s=20+shockT*260*shockP**.5, o=Math.max(0,1-shockT/1.1);
    shock.scale.setScalar(s); shock.material.opacity=o*.22; ring.scale.setScalar(s*1.3); ring.material.opacity=o*.5; if(o<=0) shockT=-1; }
  beacon.visible = (now%1.6)<.8;

  // --- camera shake
  shake*=Math.exp(-rdt*1.6);
  world.position.set(RS(shake),RS(shake)*.6,RS(shake));

  // --- HUD
  const sec=36+t, mm=23+Math.floor(sec/60), ss=Math.floor(sec%60);
  $('clk').textContent=`01:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  const p=power(), pw=$('pw');
  pw.textContent = p<0 ? 'NO SIGNAL' : Math.round(p).toLocaleString('en')+' MW';
  pw.classList.toggle('hot', p<0||p>1000);
  $('barf').style.width = (p<0?100:Math.min(100,Math.log10(p/150)/Math.log10(33000/150)*100))+'%';
  let ci=0; caps.forEach((c,i)=>{ if(t>=c[0]) ci=i; });
  if(ci!==capI){ capI=ci; $('capt').textContent=caps[ci][1]; $('capx').textContent=caps[ci][2]; }
  $('tlf').style.width=Math.min(100,t/T_END*100)+'%';

  controls.update();
  renderer.render(scene,camera);
}
frame();
</script>
